<div>
  <div nz-row>
    <h1 nz-card-grid [ngStyle]="gridStyle">Goal</h1>
  </div>
  <div nz-row>
    <div nz-col nzFlex="2">
      <nz-card nzType="inner" nzTitle="Post New Goal" style="margin-top: 16px">
        <form nz-form [formGroup]="goalForm" class="custom-form" (ngSubmit)="submitGoalForm()">
          <nz-form-item>
            <nz-form-control>
              <textarea
                nz-input
                placeholder="Enter description"
                formControlName="description"
                [nzAutosize]="{ minRows: 2, maxRows: 6 }"
              ></textarea>
            </nz-form-control>
          </nz-form-item>

          <nz-form-item>
            <nz-form-control nzErrorTip="Please, input the start date!">
              <nz-date-picker formControlName="startDate" style="width: 100%"></nz-date-picker>
            </nz-form-control>
          </nz-form-item>

          <nz-form-item>
            <nz-form-control nzErrorTip="Please, input the end date!">
              <nz-date-picker formControlName="endDate" style="width: 100%"></nz-date-picker>
            </nz-form-control>
          </nz-form-item>

          <button
            nz-button
            nzType="primary"
            nzBlock
            class="w-100"
            type="submit"
            [disabled]="goalForm.invalid"
          >
            Post Goal
          </button>
        </form>
      </nz-card>
    </div>
    <div nz-col nzFlex="3" style="margin-left: 28px">
      <nz-card nzType="inner" nzTitle="Past Goals" style="margin-top: 16px">
        <div nz-card-grid *ngFor="let goal of goals" style="width: 100%">
          <div nz-col nzSpan="30">
            Description: <strong>{{ goal.description }}</strong>
            -
            Start Date: <strong>{{ goal.startDate | date }}</strong>
            -
            End Date: <strong>{{ goal.endDate | date }}</strong>
            -
            Achieved: <strong>{{ goal.achieved }}</strong>

            <span *ngIf="!goal.achieved" (click)="updateGoalStatus(goal.id)" nz-icon [nzType]="'check-circle'" [nzTheme]="'twotone'" [nzTwotoneColor]="'#52c41a'" style="margin-left: 15px;"></span>
          </div>
        </div>
      </nz-card>
    </div>
  </div>
</div>
